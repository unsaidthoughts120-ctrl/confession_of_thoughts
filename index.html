<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConfessHub | Login</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

  <main class="auth-card">

    <!-- Left decorative panel + tabs -->
    <aside class="auth-side">
      <nav class="auth-tabs" role="tablist">
        <button class="auth-tab active" role="tab" data-target="panel-login" aria-selected="true">LOGIN</button>
        <button class="auth-tab" role="tab" data-target="panel-signup" aria-selected="false">SIGN IN</button>
      </nav>
    </aside>

    <!-- Right form area -->
    <section class="auth-main">

      <!-- LOGIN -->
      <div class="auth-panel" id="panel-login">
        <img class="auth-logo" src="assets/logo.svg" alt="StudyHub logo" />
        <h1 class="auth-title">LOGIN</h1>

        <form id="login-form" novalidate>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="9.5" r="3.6" fill="currentColor"/><path d="M4.8 19.5c1.6-3.6 4.2-4.9 7.2-4.9s5.6 1.3 7.2 4.9c-1.9 1.9-4.4 3-7.2 3s-5.3-1.1-7.2-3z" fill="currentColor"/></svg>
            <input type="email" id="login-email" placeholder="Email" autocomplete="username" required />
          </div>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7.5a5 5 0 0110 0V10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4.5" y="10" width="15" height="11.5" rx="2.5" fill="currentColor"/><circle cx="12" cy="15" r="1.5" fill="#fff"/><rect x="11.3" y="15.5" width="1.4" height="3" fill="#fff"/></svg>
            <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
            <button type="button" class="toggle-pass" data-for="login-password" aria-label="Show password">show</button>
          </div>

          <p class="form-error" id="login-error" role="alert"></p>

          <div class="form-actions">
            <a href="#" class="link-accent" id="forgot-link">Forgot Password?</a>
            <button type="submit" class="btn-pill">LOGIN</button>
          </div>
        </form>
      </div>

      <!-- SIGN UP -->
      <div class="auth-panel hidden" id="panel-signup">
        <img class="auth-logo" src="assets/logo.svg" alt="StudyHub logo" />
        <h1 class="auth-title">SIGN IN</h1>

        <form id="signup-form" novalidate>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="9.5" r="3.6" fill="currentColor"/><path d="M4.8 19.5c1.6-3.6 4.2-4.9 7.2-4.9s5.6 1.3 7.2 4.9c-1.9 1.9-4.4 3-7.2 3s-5.3-1.1-7.2-3z" fill="currentColor"/></svg>
            <input type="text" id="signup-name" placeholder="Full name" autocomplete="name" required />
          </div>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 7l9 6.5L21 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <input type="email" id="signup-email" placeholder="Email" autocomplete="email" required />
          </div>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7.5a5 5 0 0110 0V10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4.5" y="10" width="15" height="11.5" rx="2.5" fill="currentColor"/><circle cx="12" cy="15" r="1.5" fill="#fff"/><rect x="11.3" y="15.5" width="1.4" height="3" fill="#fff"/></svg>
            <input type="password" id="signup-password" placeholder="Password (min 6 characters)" autocomplete="new-password" required />
            <button type="button" class="toggle-pass" data-for="signup-password" aria-label="Show password">show</button>
          </div>

          <p class="form-error" id="signup-error" role="alert"></p>

          <div class="form-actions">
            <a href="#" class="link-accent" data-switch="panel-login">Have an account?</a>
            <button type="submit" class="btn-pill">CREATE</button>
          </div>
        </form>
      </div>

      <!-- Social logins -->
      <footer class="auth-social">
        <span class="social-label">Or Login with</span>
        <button class="social-btn" data-provider="Google" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          <span>Google</span>
        </button>
        <button class="social-btn" data-provider="Facebook" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="3" fill="#3b5998"/><path fill="#fff" d="M16.6 24v-9.3h3.1l.5-3.6h-3.6V8.8c0-1 .3-1.8 1.8-1.8h1.9V3.8c-.3 0-1.5-.1-2.8-.1-2.8 0-4.6 1.7-4.6 4.7v2.7H9.8v3.6h3.1V24h3.7z"/></svg>
          <span>Facebook</span>
        </button>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
