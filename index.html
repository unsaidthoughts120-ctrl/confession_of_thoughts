<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConfessHub | Login</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">

  <main class="auth-split">

    <!-- Left: brand -->
    <section class="auth-brand">
      <div class="brand-tile"><img src="assets/logo.svg" alt="ConfessHub logo" /></div>
      <h1 class="brand-title">CONFESS <span>HUB</span></h1>
      <p class="brand-tag">Share, connect and chat with your classmates. Say what's on your mind.</p>
    </section>

    <!-- Right: forms -->
    <section class="auth-main">
      <div class="auth-box">

        <!-- LOGIN -->
        <div class="auth-panel" id="panel-login">
          <h2 class="auth-title">Welcome back</h2>
          <p class="auth-sub">Please enter your details to sign in.</p>

          <form id="login-form" novalidate>
            <label class="f-label" for="login-email">Email Address</label>
            <div class="field">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6.5L21 7"/></svg>
              <input type="email" id="login-email" placeholder="name@email.com" autocomplete="username" required />
            </div>

            <label class="f-label" for="login-password">Password</label>
            <div class="field">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
              <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="toggle-pass" data-for="login-password" aria-label="Show password">show</button>
            </div>

            <p class="form-error" id="login-error" role="alert"></p>
            <button type="submit" class="btn-pill">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
              Sign in
            </button>
            <p class="auth-switch"><a href="#" class="link-accent" id="forgot-link">Forgot password?</a></p>
          </form>

          <p class="auth-switch">Don't have an account? <a href="#" class="link-accent" data-switch="panel-signup">Create one</a></p>
        </div>

        <!-- SIGN UP -->
        <div class="auth-panel hidden" id="panel-signup">
          <h2 class="auth-title">Create account</h2>
          <p class="auth-sub">Join ConfessHub in a few seconds.</p>

          <form id="signup-form" novalidate>
            <label class="f-label" for="signup-name">Full name</label>
            <div class="field">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.7-3.7 3.4-5.5 7-5.5s6.3 1.8 7 5.5"/></svg>
              <input type="text" id="signup-name" placeholder="Your name" autocomplete="name" required />
            </div>

            <label class="f-label" for="signup-email">Email Address</label>
            <div class="field">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6.5L21 7"/></svg>
              <input type="email" id="signup-email" placeholder="name@email.com" autocomplete="email" required />
            </div>

            <label class="f-label" for="signup-password">Password</label>
            <div class="field">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
              <input type="password" id="signup-password" placeholder="Min 6 characters" autocomplete="new-password" required />
              <button type="button" class="toggle-pass" data-for="signup-password" aria-label="Show password">show</button>
            </div>

            <p class="form-error" id="signup-error" role="alert"></p>
            <button type="submit" class="btn-pill">Create account</button>
          </form>

          <p class="auth-switch">Already have an account? <a href="#" class="link-accent" data-switch="panel-login">Sign in</a></p>
        </div>

        <!-- Social logins -->
        <div class="auth-social">
          <span class="social-label">or continue with</span>
          <div class="social-row">
            <button class="social-btn" data-provider="Google" type="button">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
              <span>Google</span>
            </button>
            <button class="social-btn" data-provider="Facebook" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="3" fill="#3b5998"/><path fill="#fff" d="M16.6 24v-9.3h3.1l.5-3.6h-3.6V8.8c0-1 .3-1.8 1.8-1.8h1.9V3.8c-.3 0-1.5-.1-2.8-.1-2.8 0-4.6 1.7-4.6 4.7v2.7H9.8v3.6h3.1V24h3.7z"/></svg>
              <span>Facebook</span>
            </button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
